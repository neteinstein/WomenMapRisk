# PR + main validation. Jobs run IN PARALLEL; each one is an independent signal. See CI_CD.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"

jobs:
  build-android:
    name: Android build (debug + R8 release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci/prepare-placeholders.sh
      - name: Assemble debug and minified release, both flavours (debug-signed when no keystore secret)
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease
      - name: Verify obfuscation
        run: scripts/ci/verify-obfuscation.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: |
            androidApp/build/outputs/apk/**/*.apk
            androidApp/build/outputs/mapping/*/mapping.txt
          retention-days: 7

  unit-tests:
    name: Unit tests (commonTest on JVM) + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci/prepare-placeholders.sh
      - name: Run all shared tests on the JVM
        run: ./gradlew testDebugUnitTest koverXmlReport koverHtmlReport --continue
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/reports/kover/report.xml ]; then
            python3 scripts/ci/coverage-summary.py build/reports/kover/report.xml >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/kover/
          retention-days: 7

  lint:
    name: Lint (ktlint, Android lint, strings parity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci/prepare-placeholders.sh
      - name: Generated strings are in sync with core/designsystem/strings.py
        run: python3 core/designsystem/strings.py && git diff --exit-code -- core/designsystem/src/commonMain/composeResources
      - run: ./gradlew ktlintCheck :androidApp:lintGithubDebug :androidApp:lintPlaystoreDebug --continue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/
            androidApp/build/reports/lint-results-*.html
          retention-days: 7

  build-ios:
    name: iOS simulator build (hand-authored Xcode project)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: scripts/ci/prepare-placeholders.sh
      - name: xcodebuild (unsigned, arm64 simulator; runs embedAndSignAppleFrameworkForXcode)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build CODE_SIGNING_ALLOWED=NO build

  build-web:
    name: Web build (Kotlin/JS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci/prepare-placeholders.sh
      - run: ./gradlew :composeApp:jsBrowserDistribution
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: composeApp/build/dist/js/productionExecutable/
          retention-days: 7

  supabase-db:
    name: Database (migrations + pgTAP on real Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - name: Start local Postgres, apply migrations + seed
        run: |
          supabase db start
          supabase db reset
      - name: pgTAP tests
        run: supabase test db
