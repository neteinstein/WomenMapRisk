# Android release: on every push to main (or manual dispatch) builds both distribution flavours, signed and
# R8-minified, creates a GitHub Release with them, and, once a Play service account is configured, uploads the
# "playstore" AAB to the Play Console (internal track by default). See CI_CD.md → "Android release".
#   github    → self-updating APK (Settings → App updates reads this repo's releases: tag android-v*, *-github.apk)
#   playstore → APK + AAB for Play; no self-update
name: Release Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
  VERSION_NAME: "1.0.${{ github.run_number }}"
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: "1.0.${{ github.run_number }}"

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6

      # Fail fast before spending CI time on lint/test/build if the signing secrets aren't set up.
      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Action secrets: ${missing[*]}"
            exit 1
          fi
          [ -z "$GOOGLE_SERVICES_JSON" ] && echo "::warning::GOOGLE_SERVICES_JSON not set: release uses the placeholder Firebase config (no Crashlytics)."
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY not set: this release runs in demo mode (read-only sample data)."
          fi
          true

      # Real Firebase config when the secret exists; otherwise the committed placeholder.
      - name: Prepare config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          scripts/ci/prepare-placeholders.sh
          [ -n "$GOOGLE_SERVICES_JSON" ] && echo "CRASHLYTICS_UPLOAD_MAPPING=true" >> "$GITHUB_ENV"
          true

      # ci.yml validates the PR, but a squash/rebase merge lands a commit on main that was never itself
      # built or tested, so this is the only gate covering the exact commit about to be released.
      - name: Lint and unit tests
        run: ./gradlew ktlintCheck testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          scripts/ci/decode-base64-secret.sh ANDROID_KEYSTORE_BASE64 "$RUNNER_TEMP/release.keystore"
          # Fail here, not deep inside Gradle, if the file, store password or alias is wrong.
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null \
            || { echo "::error::Keystore from ANDROID_KEYSTORE_BASE64 can't be opened with ANDROID_KEYSTORE_PASSWORD or has no alias ANDROID_KEY_ALIAS."; exit 1; }

      # assembleRelease = assembleGithubRelease + assemblePlaystoreRelease.
      - name: Build signed release APKs and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundlePlaystoreRelease --stacktrace

      # A silently un-obfuscated build must not reach users.
      - name: Verify obfuscation
        run: scripts/ci/verify-obfuscation.sh

      # Release-facing names + SHA-1s. mapping.txt is copied, not moved: it is an R8 task output, and removing
      # it would make Gradle re-run minification in the Play publish step, producing a different mapping.
      - name: Prepare release artifacts
        id: artifact
        run: |
          base="WomenRiskMap_version${VERSION_NAME//./_}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"

          # The "-github.apk" suffix and "android-v" tag are what GitHubAppUpdater looks for. Keep them in sync.
          for flavor in github playstore; do
            apk="$out/$base-$flavor.apk"
            cp "androidApp/build/outputs/apk/$flavor/release/androidApp-$flavor-release.apk" "$apk"
            cp "androidApp/build/outputs/mapping/${flavor}Release/mapping.txt" "$out/$base-$flavor-mapping.txt"
            echo "${flavor}_sha1=$(sha1sum "$apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          done
          aab="$out/$base-playstore.aab"
          cp androidApp/build/outputs/bundle/playstoreRelease/androidApp-playstore-release.aab "$aab"
          {
            echo "aab_sha1=$(sha1sum "$aab" | awk '{print $1}')"
            echo "dir=$out"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ steps.artifact.outputs.dir }}
          GITHUB_SHA1: ${{ steps.artifact.outputs.github_sha1 }}
          PLAYSTORE_SHA1: ${{ steps.artifact.outputs.playstore_sha1 }}
          AAB_SHA1: ${{ steps.artifact.outputs.aab_sha1 }}
        run: |
          gh release create "android-v${VERSION_NAME}" "$DIR"/* \
            --target "$GITHUB_SHA" \
            --title "Android v${VERSION_NAME}" \
            --notes "**github flavour (self-updating) APK SHA-1:** \`${GITHUB_SHA1}\`. Install this one for direct downloads.
          **playstore flavour APK SHA-1:** \`${PLAYSTORE_SHA1}\` (no self-update)
          **playstore App Bundle (.aab) SHA-1:** \`${AAB_SHA1}\`. Upload this by hand in the Play Console for the app's first release; after that the workflow uploads it.

          The \`*-mapping.txt\` files are R8's rename tables for each flavour of this release. A stack trace only becomes readable when run through it (\`retrace <mapping.txt> <trace.txt>\`); each release has its own." \
            --generate-notes

      # The `secrets` context isn't available in step-level `if:`, so check presence here and pass it on.
      - name: Check Play publisher credentials
        id: play_creds
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: echo "has_credentials=${{ env.ANDROID_PUBLISHER_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"

      # Optional: only once a Play Console service account key is configured. Uploads the playstore AAB to the
      # "internal" track (or vars.PLAY_TRACK) via Gradle Play Publisher (androidApp/build.gradle.kts). Never the
      # github flavour: it shares the applicationId.
      - name: Publish to Play Store
        id: publish_play
        if: steps.play_creds.outputs.has_credentials == 'true'
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
        run: ./gradlew :androidApp:publishPlaystoreReleaseBundle --stacktrace

      - name: Play Store publish failure hint
        if: failure() && steps.publish_play.outcome == 'failure'
        run: |
          echo "::error::publishPlaystoreReleaseBundle failed. A 403/PERMISSION_DENIED from androidpublisher.googleapis.com is almost always the service account's Play Console access (not invited to the app, no first manual release yet, Android Publisher API not enabled, or a permission still propagating), not this workflow. See CI_CD.md → Android release."

      - name: Skip Play Store publish
        if: steps.play_creds.outputs.has_credentials != 'true'
        run: echo "::notice::ANDROID_PUBLISHER_CREDENTIALS secret not set; skipping Play Store publish. See CI_CD.md."
