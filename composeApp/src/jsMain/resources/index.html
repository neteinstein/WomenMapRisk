<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6B3FA0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151218" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Women Risk Map: um mapa de segurança feito por mulheres, para mulheres.">
  <title>Women Risk Map</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FFF7FE; }
    @media (prefers-color-scheme: dark) { html, body { background: #151218; } }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; font: 600 18px system-ui, sans-serif; color: #6B3FA0; }
    @media (prefers-color-scheme: dark) { #splash { color: #D7BAFF; } }
    #splash svg { width: 96px; height: 96px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); opacity: .8; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Women Risk Map">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4z"/></svg>
  </div>
  <script src="composeApp.js"></script>
  <script>
    // Remove the HTML splash once Compose has attached its canvas.
    new MutationObserver((_, obs) => {
      if (document.querySelector('canvas')) { document.getElementById('splash')?.remove(); obs.disconnect(); }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
